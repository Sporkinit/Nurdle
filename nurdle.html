<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURDLE — Word Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --surface: #10101e;
  --surface2: #18182a;
  --border: #252538;
  --border2: #32324a;
  --accent: #e2ff5a;
  --accent2: #5affd4;
  --danger: #ff5a6e;
  --warn: #ffb05a;
  --text: #eeeef8;
  --text2: #7777a0;
  --text3: #4a4a70;
  --correct: #3dd68c;
  --present: #f5c518;
  --absent: #2a2a40;
  --tile: 60px;
  --gap: 5px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* SPLASH */
#splash{align-items:center;justify-content:center;position:relative;overflow:hidden;}
.splash-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(226,255,90,0.07) 0%, transparent 70%),radial-gradient(ellipse 40% 30% at 80% 80%, rgba(90,255,212,0.04) 0%, transparent 60%);pointer-events:none;}
.splash-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);background-size:40px 40px;pointer-events:none;}
.splash-inner{text-align:center;z-index:1;padding:2rem;}
.game-logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,16vw,140px);letter-spacing:18px;color:var(--accent);line-height:0.9;animation:logoGlow 4s ease-in-out infinite alternate;}
@keyframes logoGlow{from{text-shadow:0 0 30px rgba(226,255,90,0.25);}to{text-shadow:0 0 80px rgba(226,255,90,0.55),0 0 160px rgba(226,255,90,0.15);}}
.game-tagline{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:7px;color:var(--text3);margin-top:6px;text-transform:uppercase;}
.name-wrap{margin-top:52px;}
.field-label{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--text2);text-transform:uppercase;margin-bottom:10px;}
.name-input{background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:'Space Mono',monospace;font-size:20px;padding:14px 24px;border-radius:3px;width:300px;text-align:center;letter-spacing:6px;text-transform:uppercase;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.name-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,255,90,0.1);}
.name-input::placeholder{color:var(--text3);}
.btn-play{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#080810;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:3px;padding:16px 44px;border:none;border-radius:3px;cursor:pointer;margin-top:22px;text-transform:uppercase;transition:transform 0.15s,box-shadow 0.2s;}
.btn-play:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(226,255,90,0.3);}
.btn-play:active{transform:scale(0.97);}
.splash-bottom{margin-top:28px;display:flex;gap:12px;justify-content:center;}
.btn-ghost{background:transparent;color:var(--text2);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;padding:9px 18px;border:1px solid var(--border);border-radius:3px;cursor:pointer;text-transform:uppercase;transition:border-color 0.2s,color 0.2s;}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2);}


/* GAME */
#game{flex-direction:column;}
.game-header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.hdr-left{display:flex;align-items:center;gap:14px;}
.hdr-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:5px;color:var(--accent);}
.cat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:2px;padding:3px 9px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--accent2);text-transform:uppercase;}
.hdr-stats{display:flex;gap:22px;align-items:center;}
.stat{text-align:right;}
.stat-lbl{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--text);line-height:1.1;}
.stat-val.hi{color:var(--accent);}
.game-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 14px 10px;gap:12px;overflow-y:auto;}

/* TIMER */
.timer-wrap{width:100%;max-width:480px;}
.timer-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.timer-lbl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;}
.timer-num{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:var(--accent);transition:color 0.3s;min-width:50px;text-align:right;}
.timer-num.warn{color:var(--warn);}
.timer-num.hot{color:var(--danger);animation:timerPulse 0.5s ease infinite alternate;}
@keyframes timerPulse{from{opacity:1;}to{opacity:0.5;}}
.timer-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.timer-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 0.1s linear,background 0.3s;}
.timer-bar.warn{background:var(--warn);}
.timer-bar.hot{background:var(--danger);}

/* MESSAGE */
.game-msg{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;min-height:16px;text-align:center;}

/* SCORE BREAKDOWN */
#score-breakdown{width:100%;max-width:480px;font-family:'Space Mono',monospace;font-size:11px;display:flex;flex-direction:column;gap:3px;overflow:hidden;max-height:0;transition:max-height 0.4s ease;}
#score-breakdown.show{max-height:200px;}
.bd-line{display:flex;justify-content:space-between;padding:2px 0;opacity:0;transform:translateX(-6px);transition:opacity 0.25s ease,transform 0.25s ease;}
.bd-line.visible{opacity:1;transform:translateX(0);}
.bd-line .bd-desc{color:var(--text2);letter-spacing:1px;}
.bd-line .bd-pts{font-weight:700;}
.bd-line .bd-pts.pos{color:var(--correct);}
.bd-line .bd-pts.neg{color:var(--danger);}
.bd-line .bd-pts.total{color:var(--accent);font-size:13px;}
.bd-divider{height:1px;background:var(--border);margin:3px 0;opacity:0;transition:opacity 0.25s ease;}
.bd-divider.visible{opacity:1;}

/* DEFINITION INLINE */
#def-inline{display:none;width:100%;max-width:480px;background:rgba(226,255,90,0.06);border:1px solid rgba(226,255,90,0.22);border-radius:6px;padding:10px 14px;}
#def-inline.show{display:block;}
.def-inline-lbl{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:4px;}
.def-inline-txt{font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.5;color:var(--text2);font-style:italic;}

/* GRID */
.wordle-grid{display:flex;flex-direction:column;gap:var(--gap);}
.grid-row{display:flex;gap:var(--gap);}
.tile{width:var(--tile);height:var(--tile);border:2px solid var(--border);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;color:var(--text);background:var(--surface);transition:border-color 0.1s;user-select:none;}
.tile.filled{border-color:var(--border2);animation:pop 0.1s ease;}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.13);}100%{transform:scale(1);}}
.tile.flip{animation:flip 0.48s ease forwards;}
@keyframes flip{0%{transform:rotateX(0);}49%{transform:rotateX(-90deg);}50%{transform:rotateX(-90deg);}100%{transform:rotateX(0);}}
.tile.correct{background:var(--correct);border-color:var(--correct);color:#080810;}
.tile.present{background:var(--present);border-color:var(--present);color:#080810;}
.tile.absent{background:var(--absent);border-color:var(--absent);color:var(--text2);}
.tile.shake{animation:shake 0.38s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.tile.win-bounce{animation:winbounce 0.55s ease;}
@keyframes winbounce{0%,100%{transform:translateY(0);}35%{transform:translateY(-18px);}65%{transform:translateY(-7px);}}
.tile.hint-revealed{border-color:var(--accent) !important;background:rgba(226,255,90,0.12) !important;color:var(--accent) !important;animation:hintPulse 0.7s ease;}
@keyframes hintPulse{0%{box-shadow:0 0 0 0 rgba(226,255,90,0.7);}100%{box-shadow:0 0 0 18px rgba(226,255,90,0);}}

/* LIFELINES */
.lifelines{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.ll-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 6px;cursor:pointer;text-align:center;transition:border-color 0.2s,transform 0.15s,opacity 0.2s;color:var(--text);}
.ll-btn:hover:not(:disabled){border-color:var(--accent2);transform:translateY(-2px);}
.ll-btn:disabled{opacity:0.25;cursor:not-allowed;transform:none;}
.ll-btn.locked{opacity:0.35;cursor:not-allowed;pointer-events:none;}
.ll-icon{font-size:17px;margin-bottom:3px;}
.ll-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--text2);text-transform:uppercase;line-height:1.4;}
.ll-cost{font-family:'Space Mono',monospace;font-size:8px;color:var(--danger);margin-top:2px;}

/* KEYBOARD */
.keyboard{width:100%;max-width:480px;}
.kb-row{display:flex;justify-content:center;gap:4px;margin-bottom:4px;}
.key{min-width:34px;height:50px;border-radius:3px;border:none;background:var(--surface2);color:var(--text);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.18s,transform 0.08s;padding:0 4px;flex:1;max-width:40px;user-select:none;}
.key.wide{max-width:58px;font-size:9px;letter-spacing:0;}
.key:active{transform:scale(0.91);}
.key.correct{background:var(--correct);color:#080810;}
.key.present{background:var(--present);color:#080810;}
.key.absent{background:#1c1c2c;color:var(--text3);}

/* GAME OVER */
#gameover{align-items:center;justify-content:center;padding:2rem;}
.go-inner{text-align:center;max-width:420px;width:100%;}
.go-title{font-family:'Bebas Neue',sans-serif;font-size:76px;letter-spacing:8px;line-height:1;color:var(--danger);}
.go-title.timeout{color:var(--warn);}
.go-reveal-word{font-family:'Space Mono',monospace;font-size:12px;color:var(--text2);margin-top:10px;letter-spacing:2px;}
.go-reveal-word span{color:var(--accent);letter-spacing:5px;font-weight:700;}
.score-box{margin:28px 0;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:28px 24px;}
.final-score-lbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--text2);text-transform:uppercase;}
.final-score-num{font-family:'Bebas Neue',sans-serif;font-size:88px;letter-spacing:4px;color:var(--accent);line-height:1;}
.breakdown{display:flex;justify-content:center;gap:28px;margin-top:18px;flex-wrap:wrap;}
.bd-item{text-align:center;}
.bd-val{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--text);}
.bd-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
.go-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* SCOREBOARD */
#scoreboard{align-items:center;padding:2rem 1rem;}
.sb-wrap{width:100%;max-width:580px;}
.sb-table{width:100%;border-collapse:collapse;margin-top:4px;}
.sb-table th{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);}
.sb-table td{padding:13px 14px;border-bottom:1px solid rgba(37,37,56,0.6);font-size:14px;}
.sb-rank{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--text3);width:44px;}
.sb-rank.g{color:var(--accent);}.sb-rank.s{color:#c0c0d8;}.sb-rank.b{color:#c8956a;}
.sb-name{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:1px;}
.sb-name.you{color:var(--accent);}
.sb-score{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--text);}
.sb-meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--text2);}
.sb-empty{font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);text-align:center;padding:40px 0;}
.sb-loading{font-family:'Space Mono',monospace;font-size:11px;color:var(--text2);text-align:center;padding:30px 0;letter-spacing:2px;animation:blink 1s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.sb-error{font-family:'Space Mono',monospace;font-size:10px;color:var(--warn);text-align:center;padding:20px;border:1px solid rgba(255,176,90,0.25);border-radius:4px;margin-top:12px;}

/* TOAST */
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-12px);background:var(--text);color:var(--bg);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;padding:9px 20px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity 0.18s,transform 0.18s;z-index:300;text-transform:uppercase;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div id="toast"></div>

<!-- SPLASH -->
<div class="screen active" id="splash">
  <div class="splash-bg"></div><div class="splash-grid"></div>
  <div class="splash-inner">
    <div class="game-logo">NURDLE</div>
    <div class="game-tagline">Five-letter word challenge</div>
    <div class="name-wrap">
      <label class="field-label" for="player-name">Your name</label>
      <input class="name-input" type="text" id="player-name" maxlength="16" placeholder="PLAYER" autocomplete="off">
    </div>
    <button class="btn-play" onclick="startFromSplash()">Play →</button>
    <div class="splash-bottom"><button class="btn-ghost" onclick="goScoreboard('splash')">Scoreboard</button></div>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="game-header">
    <div class="hdr-left">
      <div class="hdr-logo">NURDLE</div>
      
    </div>
    <div class="hdr-stats">
      <div class="stat"><div class="stat-lbl">Score</div><div class="stat-val hi" id="hdr-score">0</div></div>
      <div class="stat"><div class="stat-lbl">Streak</div><div class="stat-val" id="hdr-streak">0</div></div>
      <div class="stat"><div class="stat-lbl">Word #</div><div class="stat-val" id="hdr-word">1</div></div>
    </div>
  </div>
  <div class="game-body">
    <div class="timer-wrap">
      <div class="timer-row"><span class="timer-lbl">Time remaining</span><span class="timer-num" id="timer-num">2:00</span></div>
      <div class="timer-track"><div class="timer-bar" id="timer-bar" style="width:100%"></div></div>
    </div>
    <div class="game-msg" id="game-msg"></div>
    <!-- Score breakdown animates in here after each win -->
    <div id="score-breakdown"></div>
    <!-- Definition shown inline when lifeline used -->
    <div id="def-inline"><div class="def-inline-lbl">Definition</div><div class="def-inline-txt" id="def-inline-txt"></div></div>
    <div class="wordle-grid" id="wordle-grid"></div>
    <div class="lifelines">
      <button class="ll-btn" id="ll-extra"  onclick="useLifeline('extra')"><div class="ll-icon">➕</div><div class="ll-label">Extra<br>Guess</div><div class="ll-cost">−30 pts</div></button>
      <button class="ll-btn" id="ll-reveal" onclick="useLifeline('reveal')"><div class="ll-icon">🔍</div><div class="ll-label">Reveal<br>Letter</div><div class="ll-cost">−60 pts</div></button>
      <button class="ll-btn" id="ll-time"   onclick="useLifeline('time')"><div class="ll-icon">⏱</div><div class="ll-label">+60<br>Seconds</div><div class="ll-cost">−30 pts</div></button>
      <button class="ll-btn" id="ll-def"    onclick="useLifeline('definition')"><div class="ll-icon">📖</div><div class="ll-label">Definition</div><div class="ll-cost">−60 pts</div></button>
    </div>
    <div class="keyboard" id="keyboard">
      <div class="kb-row" id="kb-0"></div>
      <div class="kb-row" id="kb-1"></div>
      <div class="kb-row" id="kb-2"></div>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div class="screen" id="gameover">
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;">
    <div class="go-inner">
      <div class="go-title" id="go-title">GAME<br>OVER</div>
      <div class="go-reveal-word" id="go-word"></div>
      <div class="score-box">
        <div class="final-score-lbl">Final Score</div>
        <div class="final-score-num" id="go-score">0</div>
        <div class="breakdown">
          <div class="bd-item"><div class="bd-val" id="go-words">0</div><div class="bd-lbl">Words</div></div>
          <div class="bd-item"><div class="bd-val" id="go-streak">0</div><div class="bd-lbl">Best Streak</div></div>
          
        </div>
      </div>
      <div class="go-actions">
        <button class="btn-play" onclick="playAgain()">Play Again →</button>
        <button class="btn-ghost" onclick="goScoreboard('gameover')">Scoreboard</button>
      </div>
    </div>
  </div>
</div>

<!-- SCOREBOARD -->
<div class="screen" id="scoreboard">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;">
    <div class="sb-wrap">
      <div class="screen-eyebrow">Rankings</div>
      <div class="screen-heading" style="margin-bottom:24px;">SCOREBOARD</div>
      <div id="sb-content"><div class="sb-loading">Loading scores...</div></div>
      <div style="text-align:center;margin-top:24px;"><button class="btn-ghost" onclick="leaveSB()">← Back</button></div>
    </div>
  </div>
</div>

<script>
// ══ CONFIGURATION ══
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxBygK6J3cO7ofdKdiPgAnW20HT8oWAMubPYoEKo1IwVOUx5RkLC1u6X2UOisqd6V9Odw/exec';
const LL_COST = { extra:30, time:30, reveal:60, definition:60 };

// ══════════════════════════════════════════════════════════
//  SOUNDS
//  Place audio files in a "sounds/" folder next to nurdle.html
//  Rename your files to match, or change the paths below.
//  Supported: .mp3  .ogg  .wav
// ══════════════════════════════════════════════════════════
const SFX = {
  // 1. Key press — fires every time a letter is typed
  type:    new Audio('sounds/type.mp3'),

  // 2. Green tile — fires once per tile that flips green
  //    Only triggers for newly-correct tiles, not already-known ones
  green:   new Audio('sounds/green.mp3'),

  // 3. Word win — fires when the full word is guessed correctly
  win:     new Audio('sounds/win.mp3'),

  // 4. Time warning — loops for the final 10 seconds, stops on win or timeout
  warning: new Audio('sounds/warning.mp3'),
};
SFX.warning.loop = true;
SFX.type.volume    = 0.4;
SFX.green.volume   = 0.7;
SFX.win.volume     = 1.0;
SFX.warning.volume = 0.6;

function sfx(name) {
  try { const s = SFX[name]; if (!s) return; s.currentTime = 0; s.play().catch(()=>{}); } catch(e){}
}
function sfxStop(name) {
  try { const s = SFX[name]; if (!s) return; s.pause(); s.currentTime = 0; } catch(e){}
}


const WORDS = [
  {word:"ABACK",definition:"Backward, back"},
  {word:"ABASE",definition:"To lower in rank, office, prestige, or esteem"},
  {word:"ABASH",definition:"To destroy the self-possession or self-confidence of (someone) : disconcert"},
  {word:"ABATE",definition:"To decrease in force or intensity"},
  {word:"ABBEY",definition:"A monastery ruled by an abbot"},
  {word:"ABBOT",definition:"The superior of a monastery for men"},
  {word:"ABHOR",definition:"To regard with extreme repugnance : to feel hatred or loathing for : loathe"},
  {word:"ABIDE",definition:"To bear patiently : tolerate"},
  {word:"ABODE",definition:"The place where one lives : home"},
  {word:"ABOIL",definition:"Being at the boiling point : boiling"},
  {word:"ABORT",definition:"To bring forth stillborn, nonviable, or premature offspring"},
  {word:"ABOUT",definition:"Reasonably close to"},
  {word:"ABOVE",definition:"In the sky : overhead"},
  {word:"ABUSE",definition:"A corrupt practice or custom"},
  {word:"ABUZZ",definition:"Filled or resounding with or as if with a buzzing sound; especially : filled with talk or excitement"},
  {word:"ABYSS",definition:"An immeasurably deep gulf or great space"},
  {word:"ACHED",definition:"To suffer a usually dull persistent pain"},
  {word:"ACHOO",definition:"—used to represent the sound of a sneeze"},
  {word:"ACING",definition:"To score an ace against (an opponent)"},
  {word:"ACORN",definition:"The nut of the oak usually seated in or surrounded by a hard woody cupule of indurated bracts"},

  score:0, wordNum:0, streak:0, bestStreak:0,
  timerSecs:120, timerInterval:null, _hiddenAt:null, warningSounding:false,
  lifelines:{extra:false,reveal:false,time:false,definition:false},
  lifelinePenalty:0,
  revealedIdx:[],
  correctIdx:[], // positions confirmed correct in current word across all guesses so far
};
const KB_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','⌫'],
];
const WORD_MAX_TIME = 120;

// ══ BOOT ══
window.onload = () => {
  document.getElementById('player-name').addEventListener('keydown', e => { if (e.key==='Enter') startFromSplash(); });
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('visibilitychange', () => {
    if (!G.active || !G.timerInterval) return;
    if (document.hidden) {
      G._hiddenAt = performance.now();
    } else if (G._hiddenAt) {
      const elapsed = (performance.now() - G._hiddenAt) / 1000;
      G.timerSecs = Math.max(0, G.timerSecs - elapsed);
      G._hiddenAt = null;
      renderTimer();
      if (G.timerSecs <= 0) { stopTimer(); onTimeout(); }
    }
  });
};

// ══ SCREENS ══
function show(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

// ══ SPLASH ══
function startFromSplash() {
  const n = document.getElementById('player-name').value.trim().toUpperCase();
  if (!n) { toast('Enter a name first'); return; }
  G.player = n; startGame();
}
function startGame() {
  G.pool = [...WORDS];
  G.used = []; G.score = 0; G.wordNum = 0; G.streak = 0; G.bestStreak = 0;
  show('game'); buildKeyboard(); nextWord();
}



// ══ WORD SETUP ══
function nextWord() {
  let available = G.pool.filter(w=>!G.used.includes(w.word));
  if (!available.length) { G.used = []; available = [...G.pool]; }
  const pick = available[Math.floor(Math.random()*available.length)];
  G.word = pick.word; G.definition = pick.definition; G.used.push(G.word);
  G.row = 0; G.col = 0; G.maxRows = 6;
  G.guess = Array(5).fill(''); G.active = true;
  G.lifelines = {extra:false,reveal:false,time:false,definition:false};
  G.lifelinePenalty = 0; G.revealedIdx = []; G.correctIdx = [];
  G.warningSounding = false;
  G.wordNum++;
  resetLifelineUI(); resetKeyboard(); buildGrid(); clearMsg(); hideBreakdown(); updateHeader();
  startTimer();
}

// ══ TIMER ══
function startTimer() {
  stopTimer(); G.timerSecs = WORD_MAX_TIME; G._hiddenAt = null; renderTimer();
  G.timerInterval = setInterval(() => {
    if (document.hidden) return;
    G.timerSecs -= 0.1;
    if (G.timerSecs <= 10 && !G.warningSounding) { G.warningSounding = true; sfx('warning'); }
    if (G.timerSecs <= 0) { G.timerSecs = 0; renderTimer(); stopTimer(); onTimeout(); }
    else renderTimer();
  }, 100);
}
function stopTimer() {
  if (G.timerInterval) { clearInterval(G.timerInterval); G.timerInterval = null; }
  sfxStop('warning'); G.warningSounding = false;
}
function renderTimer() {
  const s = Math.ceil(G.timerSecs);
  document.getElementById('timer-num').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  document.getElementById('timer-bar').style.width = Math.max(0,(G.timerSecs/WORD_MAX_TIME)*100)+'%';
  const warn = G.timerSecs<30, hot = G.timerSecs<15;
  document.getElementById('timer-num').className = 'timer-num'+(hot?' hot':warn?' warn':'');
  document.getElementById('timer-bar').className  = 'timer-bar' +(hot?' hot':warn?' warn':'');
}

// ══ GRID ══
function buildGrid() { const g=document.getElementById('wordle-grid'); g.innerHTML=''; for(let r=0;r<G.maxRows;r++) addGridRow(r); }
function addGridRow(r) {
  const g=document.getElementById('wordle-grid');
  const row=document.createElement('div'); row.className='grid-row'; row.id='row-'+r;
  for(let c=0;c<5;c++){const t=document.createElement('div');t.className='tile';t.id=`t-${r}-${c}`;row.appendChild(t);}
  g.appendChild(row);
}
function tile(r,c){return document.getElementById(`t-${r}-${c}`);}

// ══ KEYBOARD ══
function buildKeyboard() {
  KB_ROWS.forEach((row,i)=>{
    const el=document.getElementById('kb-'+i); el.innerHTML='';
    row.forEach(k=>{const b=document.createElement('button');b.className='key'+(k.length>1?' wide':'');b.textContent=k;b.id='key-'+k;b.onclick=()=>handleKey(k);el.appendChild(b);});
  });
}
function resetKeyboard() { document.querySelectorAll('.key').forEach(k=>k.classList.remove('correct','present','absent')); }
function updateKeyboard(guess, result) {
  const pri={correct:3,present:2,absent:1};
  guess.forEach((l,i)=>{
    if(!l) return;
    const k=document.getElementById('key-'+l); if(!k) return;
    const cur=k.classList.contains('correct')?'correct':k.classList.contains('present')?'present':k.classList.contains('absent')?'absent':null;
    if(!cur||pri[result[i]]>pri[cur]){k.classList.remove('correct','present','absent');k.classList.add(result[i]);}
  });
}

// ══ INPUT ══
function onKeyDown(e) {
  if(!G.active) return;
  if(document.querySelector('.screen.active')?.id!=='game') return;
  if(e.key==='Enter') handleKey('ENTER');
  else if(e.key==='Backspace') handleKey('⌫');
  else if(/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
}
function handleKey(k) {
  if(!G.active) return;
  if(k==='⌫') {
    let del=G.col-1;
    while(del>=0&&G.revealedIdx.includes(del)) del--;
    if(del>=0&&G.guess[del]){G.guess[del]='';tile(G.row,del).textContent='';tile(G.row,del).classList.remove('filled');G.col=del;}
  } else if(k==='ENTER') {
    submitGuess();
  } else if(G.col<5) {
    G.guess[G.col]=k; tile(G.row,G.col).textContent=k; tile(G.row,G.col).classList.add('filled');
    G.col++;
    while(G.col<5&&G.revealedIdx.includes(G.col)) G.col++;
    sfx('type'); // SOUND 1: key press
  }
}

// ══ SUBMIT ══
function submitGuess() {
  const guess = Array(5).fill('').map((_,i)=>G.guess[i]||'');
  if(guess.filter(l=>l).length<5){setMsg('Not enough letters');shakeRow(G.row);return;}
  const result = evaluate(guess,G.word);
  revealRow(G.row,guess,result,()=>{
    updateKeyboard(guess,result);
    result.forEach((r,i)=>{if(r==='correct')G.correctIdx.push(i);});
    if(result.every(r=>r==='correct')) onWin();
    else { G.row++; G.col=0; G.guess=Array(5).fill(''); G.revealedIdx=[]; if(G.row>=2) unlockLifelines(); if(G.row>=G.maxRows) onLoss(); }
  });
}

// ══ EVALUATE — hardened two-pass ══
function evaluate(guess,word) {
  const res=Array(5).fill('absent'), wArr=word.split(''), gArr=guess.map(l=>l||'');
  const wordUsed=Array(5).fill(false), guessUsed=Array(5).fill(false);
  for(let i=0;i<5;i++) if(gArr[i]===wArr[i]){res[i]='correct';wordUsed[i]=true;guessUsed[i]=true;}
  for(let i=0;i<5;i++){
    if(guessUsed[i]||!gArr[i]) continue;
    for(let j=0;j<5;j++) if(!wordUsed[j]&&gArr[i]===wArr[j]){res[i]='present';wordUsed[j]=true;break;}
  }
  return res;
}

function revealRow(r,guess,result,cb) {
  const delay=340;
  result.forEach((res,i)=>{
    setTimeout(()=>{
      const t=tile(r,i); t.classList.add('flip');
      setTimeout(()=>{
        t.classList.remove('correct','present','absent','hint-revealed');
        t.classList.add(res);
        // SOUND 2: new green tile — only if not already known correct
        if(res==='correct'&&!G.correctIdx.includes(i)) sfx('green');
      },170);
      if(i===4) setTimeout(cb,delay);
    },i*delay);
  });
}

// ══ WIN / LOSS / TIMEOUT ══
function onWin() {
  stopTimer(); // also kills warning sound
  G.active=false; G.streak++; if(G.streak>G.bestStreak) G.bestStreak=G.streak;
  const attemptsLeft=G.maxRows-G.row-1, timeLeft=Math.floor(G.timerSecs);
  const base=100, attemptBonus=attemptsLeft*30, timeBonus=timeLeft;
  const wordScore=Math.max(0,base+attemptBonus+timeBonus-G.lifelinePenalty);
  G.score+=wordScore;
  setTimeout(()=>[0,1,2,3,4].forEach((c,i)=>setTimeout(()=>tile(G.row,c)?.classList.add('win-bounce'),i*80)),100);
  sfx('win'); // SOUND 3: word win
  showBreakdown({base,attemptBonus,attemptsLeft,timeBonus,penalty:G.lifelinePenalty,total:wordScore});
  updateHeader();
  setTimeout(()=>{hideBreakdown();nextWord();},3200);
}
function onLoss() { stopTimer(); G.active=false; G.streak=0; endGame(false); }
function onTimeout() { if(!G.active) return; G.active=false; G.streak=0; endGame(true); }
async function endGame(timedOut) {
  stopTimer();
  const t=document.getElementById('go-title');
  t.textContent=timedOut?'TIME\nUP':'GAME\nOVER'; t.className='go-title'+(timedOut?' timeout':'');
  document.getElementById('go-word').innerHTML=`The word was <span>${G.word}</span>`;
  document.getElementById('go-score').textContent=G.score;
  document.getElementById('go-words').textContent=G.wordNum-1;
  document.getElementById('go-streak').textContent=G.bestStreak;
  
  show('gameover'); await submitScore();
}

// ══ SCORE BREAKDOWN ANIMATION ══
function showBreakdown({base,attemptBonus,attemptsLeft,timeBonus,penalty,total}) {
  const el=document.getElementById('score-breakdown'); el.innerHTML='';
  const lines=[];
  lines.push({desc:'Word guessed',pts:`+${base}`,cls:'pos'});
  if(attemptsLeft>0) lines.push({desc:`${attemptsLeft} guesses left \u00d730`,pts:`+${attemptBonus}`,cls:'pos'});
  if(timeBonus>0) lines.push({desc:`${timeBonus}s remaining \u00d71`,pts:`+${timeBonus}`,cls:'pos'});
  if(penalty>0) lines.push({desc:'Lifeline penalty',pts:`\u2212${penalty}`,cls:'neg'});
  lines.push({divider:true});
  lines.push({desc:'Word total',pts:`+${total}`,cls:'total'});
  lines.forEach(line=>{
    if(line.divider){const d=document.createElement('div');d.className='bd-divider';el.appendChild(d);}
    else{const d=document.createElement('div');d.className='bd-line';d.innerHTML=`<span class="bd-desc">${line.desc}</span><span class="bd-pts ${line.cls}">${line.pts}</span>`;el.appendChild(d);}
  });
  el.classList.add('show');
  el.querySelectorAll('.bd-line,.bd-divider').forEach((item,i)=>setTimeout(()=>item.classList.add('visible'),100+i*110));
}
function hideBreakdown(){const el=document.getElementById('score-breakdown');el.classList.remove('show');el.innerHTML='';}

// ══ LIFELINES ══
function useLifeline(type) {
  if(!G.active) return;
  if(G.lifelines[type]){toast('Already used this word!');return;}
  G.lifelines[type]=true; const cost=LL_COST[type]; G.lifelinePenalty+=cost;
  const btnId={extra:'ll-extra',reveal:'ll-reveal',time:'ll-time',definition:'ll-def'}[type];
  const btnEl=document.getElementById(btnId);btnEl.disabled=true;btnEl.classList.add('used-this-word');

  if(type==='extra') {
    addGridRow(G.maxRows); G.maxRows++; toast(`+1 guess row  \u2212${cost} pts`);

  } else if(type==='reveal') {
    // FIX: exclude positions already correct across all previous guesses AND already hint-revealed
    const excluded=[...new Set([...G.correctIdx,...G.revealedIdx])];
    const available=[0,1,2,3,4].filter(i=>!excluded.includes(i));
    if(!available.length){
      toast('No unguessed letters left to reveal');
      G.lifelines[type]=false; document.getElementById(btnId).disabled=false; G.lifelinePenalty-=cost; return;
    }
    const idx=available[Math.floor(Math.random()*available.length)];
    G.revealedIdx.push(idx);
    const t=tile(G.row,idx); t.textContent=G.word[idx]; t.classList.add('filled','hint-revealed');
    G.guess[idx]=G.word[idx];
    G.col=0; while(G.col<5&&(G.revealedIdx.includes(G.col)||G.guess[G.col])) G.col++;
    toast(`Position ${idx+1} = ${G.word[idx]}  \u2212${cost} pts`);

  } else if(type==='time') {
    G.timerSecs=Math.min(G.timerSecs+60,WORD_MAX_TIME);
    if(G.timerSecs>10&&G.warningSounding){sfxStop('warning');G.warningSounding=false;}
    renderTimer(); toast(`+60 seconds  \u2212${cost} pts`);

  } else if(type==='definition') {
    document.getElementById('def-inline-txt').textContent=G.definition;
    document.getElementById('def-inline').classList.add('show');
    toast(`Definition revealed  \u2212${cost} pts`);
  }
}

function resetLifelineUI() {
  ['ll-extra','ll-reveal','ll-time','ll-def'].forEach(id=>{const b=document.getElementById(id);b.disabled=true;b.classList.add('locked');b.classList.remove('used-this-word');});
  document.getElementById('def-inline').classList.remove('show');
  document.getElementById('def-inline-txt').textContent='';
}
function unlockLifelines() {
  ['ll-extra','ll-reveal','ll-time','ll-def'].forEach(id=>{
    const b=document.getElementById(id);
    if(!b.classList.contains('used-this-word')){b.disabled=false;b.classList.remove('locked');}
  });
}

// ══ SCOREBOARD ══
async function submitScore() {
  if(!SHEETS_URL) return;
  try {
    await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'submit',name:G.player,score:G.score,words:G.wordNum-1,streak:G.bestStreak,totalWords:G.wordNum-1,date:new Date().toLocaleDateString('en-NZ')})});
  } catch(e){console.warn('Score submit failed',e);}
}
function loadScoresViaScript() {
  return new Promise(resolve=>{
    if(window.__nurdleCb) delete window.__nurdleCb;
    const ex=document.getElementById('sb-script'); if(ex) ex.remove();
    const timeout=setTimeout(()=>resolve(null),8000);
    window.__nurdleCb=data=>{clearTimeout(timeout);delete window.__nurdleCb;resolve(data);};
    const script=document.createElement('script'); script.id='sb-script';
    script.src=SHEETS_URL+'?action=scores&callback=__nurdleCb&_='+Date.now();
    script.onerror=()=>{clearTimeout(timeout);resolve(null);};
    document.head.appendChild(script);
  });
}
let sbFrom='splash';
async function goScoreboard(from) {
  sbFrom=from; show('scoreboard');
  document.getElementById('sb-content').innerHTML='<div class="sb-loading">Loading scores...</div>';
  renderScoreboard(await loadScoresViaScript());
}
function renderScoreboard(scores) {
  const el=document.getElementById('sb-content');
  if(!scores){el.innerHTML='<div class="sb-error">Could not load scores.<br>Check your Apps Script is deployed and the URL is correct.</div>';return;}
  if(!scores.length){el.innerHTML='<div class="sb-empty">No scores yet — be the first!</div>';return;}
  const rc=i=>i===0?'g':i===1?'s':i===2?'b':'';
  el.innerHTML=`<table class="sb-table"><thead><tr><th>#</th><th>Player</th><th>Best Score</th><th>Best Streak</th><th>Total Words</th></tr></thead><tbody>${
    scores.map((s,i)=>`<tr><td class="sb-rank ${rc(i)}">${i+1}</td><td class="sb-name ${s.name===G.player?'you':''}">${s.name}${s.name===G.player?' ◀':''}</td><td class="sb-score">${s.score}</td><td class="sb-meta">${s.streak}</td><td class="sb-meta">${s.totalWords||s.words||0}</td></tr>`).join('')
  }</tbody></table>`;
}
function leaveSB(){show(sbFrom);}

// ══ UTILS ══
function playAgain(){startGame();}
function updateHeader(){document.getElementById('hdr-score').textContent=G.score;document.getElementById('hdr-streak').textContent=G.streak;document.getElementById('hdr-word').textContent=G.wordNum;}
function setMsg(m){document.getElementById('game-msg').textContent=m;}
function clearMsg(){document.getElementById('game-msg').textContent='';}
function shakeRow(r){for(let c=0;c<5;c++){const t=tile(r,c);t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');}}
let toastT=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');if(toastT)clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);}
</script>
